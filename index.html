<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Budget Tracker</h1>
        
    </header>

    <main>

        <section id="add-expense">
            <h2>Add Expense</h2>

            <label for="expense-name">Expense Name</label>
            <input type="text" id="expense-name" placeholder="Groceries">

            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="kesh500">

            <label for="category">Category</label>
            <input type="text" id="category" placeholder="Food">
        </section>

        <section id="your-expenses">
            <h2>Your Expenses</h2>
            <p class="placeholder">No expenses yet</p>
        </section>

    </main>

</body>
</html>
